<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Camera – test</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f4f1fb; font-family: "Segoe UI", -apple-system, sans-serif; color: #1d1b2c; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; }
  h1 { margin: 0; font-size: 30px; }
  #win { position: relative; width: min(92vw, calc((100vh - 200px) * 16 / 9)); aspect-ratio: 16 / 9;
    background: #000; border: 8px solid #fff; border-radius: 6px; box-shadow: 0 18px 50px rgba(40, 20, 90, .35); overflow: hidden; }
  #win video, #win canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #win.fill video, #win.fill canvas { object-fit: cover; }
  #win.rot video, #win.rot canvas { transform: rotate(180deg); }
  #frozen { display: none; }
  #win.frozen #frozen { display: block; }
  #badge { position: absolute; top: 12px; left: 12px; z-index: 3; background: #d92d20; color: #fff; font-weight: 800;
    padding: 6px 12px; border-radius: 999px; font-size: 15px; display: none; }
  #win.live #badge { display: block; }
  #win.frozen #badge { background: #6941c6; }
  #join { position: absolute; inset: 0; z-index: 2; display: flex; align-items: center; justify-content: center; gap: 36px;
    background: #1d1b2c; color: #fff; padding: 24px; }
  #win.live #join { display: none; }
  #qr { background: #fff; padding: 12px; border-radius: 12px; }
  #qr img, #qr canvas { display: block; width: 190px; height: 190px; }
  .big { font-size: 56px; font-weight: 800; letter-spacing: 8px; }
  .steps { font-size: 18px; line-height: 1.55; max-width: 420px; }
  .steps b { color: #c4b5fd; }
  #msg { color: #fda29b; font-weight: 700; margin-top: 8px; }
  #wait { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 10px; color: #fff; font-size: 22px; font-weight: 700; text-align: center; padding: 30px; }
  #win.linking #wait { display: flex; }
  #win.linking #join { display: none; }
  #diag { position: absolute; right: 10px; bottom: 8px; z-index: 3; font: 12px/1.3 ui-monospace, monospace;
    color: rgba(255,255,255,.75); background: rgba(0,0,0,.45); padding: 3px 7px; border-radius: 6px; display: none; }
  #win.linking #diag, #win.live #diag { display: block; }
  #bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-weight: 700; font-size: 17px; border: 0; border-radius: 12px; padding: 12px 18px;
    background: #fff; color: #1d1b2c; box-shadow: 0 2px 6px rgba(0,0,0,.12); cursor: pointer; }
  button.on { background: #6941c6; color: #fff; }
</style>
</head>
<body>
<h1>📱 Board Camera: test page</h1>
<div id="win">
  <video id="v" playsinline autoplay muted></video>
  <canvas id="frozen"></canvas>
  <div id="badge">● LIVE</div>
  <div id="wait"><div id="waitMsg">📱 Camera found, connecting video…</div><div id="waitSub" style="font-size:16px;font-weight:500;color:#c4b5fd"></div></div>
  <div id="diag"></div>
  <div id="join">
    <div id="qr"></div>
    <div>
      <div class="steps">On the iPad or phone, scan this QR code with the <b>Camera app</b>, or open<br><b id="url"></b><br>and type the code:</div>
      <div class="big" id="code">······</div>
      <div class="steps" id="state">Getting ready…</div>
      <div id="msg"></div>
    </div>
  </div>
</div>
<div id="always" style="font:14px/1.4 ui-monospace,monospace;color:#555;text-align:center"></div>
<div id="bar">
  <button id="freeze">⏸ Freeze</button>
  <button id="rot">🔄 Rotate</button>
  <button id="fill">⤢ Fill</button>
  <button id="newcode">🔢 New code</button>
</div>

<script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(() => {
  const CAM_URL = 'https://contactjosephr04-sudo.github.io/bus-live/cam/';
  // ---- Shared settings (must match the camera page) ----
  const TOPIC = 'boardcam-willow-7f3a/';
  const BROKERS = window.BOARDCAM_BROKERS || [
    'wss://broker.hivemq.com:8884/mqtt',
    'wss://broker.emqx.io:8084/mqtt',
    'wss://test.mosquitto.org:8081/mqtt'
  ];
  const ICE = (window.BOARDCAM_ICE || []).concat([{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }]);

  const $ = id => document.getElementById(id);
  const win = $('win'), v = $('v'), frozen = $('frozen');
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, val) { try { localStorage.setItem(k, val); } catch (e) {} }
  };
  const rand = () => Math.random().toString(36).slice(2, 10);
  const newCode = () => String(Math.floor(100000 + Math.random() * 900000));
  let code = store.get('boardcam.code6') || newCode();
  store.set('boardcam.code6', code);
  const BID = rand();
  let bus = null, pc = null, session = null, statTimer = null, failTimer = null;

  function makeBus(onMsg, onUp) {
    const clients = [], seen = new Set(), subs = new Set();
    BROKERS.forEach(url => {
      try {
        const c = mqtt.connect(url, { connectTimeout: 6000, reconnectPeriod: 3000, clean: true, keepalive: 30 });
        c.on('connect', () => { subs.forEach(t => c.subscribe(t)); onUp(c); });
        c.on('error', () => {});
        c.on('message', (t, buf) => {
          let m; try { m = JSON.parse(buf.toString()); } catch (e) { return; }
          if (!m || seen.has(m.mid)) return;
          seen.add(m.mid); onMsg(t, m);
        });
        clients.push(c);
      } catch (e) {}
    });
    return {
      sub(t) { subs.add(t); clients.forEach(c => c.connected && c.subscribe(t)); },
      unsub(t) { subs.delete(t); clients.forEach(c => c.connected && c.unsubscribe(t)); },
      pub(t, m) { m.mid = rand() + Date.now(); const s = JSON.stringify(m); clients.forEach(c => c.connected && c.publish(t, s)); },
      up() { return clients.filter(c => c.connected).length; },
      total: BROKERS.length
    };
  }

  function gathered(p, ms) {
    return new Promise(res => {
      if (p.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, ms);
      p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }

  function showJoin() {
    $('code').textContent = code;
    $('url').textContent = CAM_URL.replace('https://', '');
    $('qr').innerHTML = '';
    if (window.QRCode) new QRCode($('qr'), { text: CAM_URL + '?c=' + code, width: 380, height: 380, correctLevel: QRCode.CorrectLevel.M });
  }

  function announce() { if (bus) bus.pub(TOPIC + code + '/cam', { type: 'board-up', bid: BID }); }

  function listen() {
    showJoin();
    bus.sub(TOPIC + code + '/board');
    announce();
  }

  function reset(msg) {
    clearInterval(statTimer); clearTimeout(failTimer);
    if (pc) try { pc.close(); } catch (e) {}
    pc = null;
    win.classList.remove('live', 'linking');
    if (msg) $('state').textContent = msg;
  }

  async function onOffer(m) {
    reset();
    session = m.session;
    win.classList.add('linking');
    $('waitMsg').textContent = '📱 Camera found, connecting video…'; $('waitSub').textContent = '';
    const p = pc = new RTCPeerConnection({ iceServers: ICE });
    p.ontrack = e => { v.srcObject = e.streams[0] || new MediaStream([e.track]); v.play().catch(() => {}); };
    const fail = why => { if (p !== pc) return; $('waitMsg').textContent = '⚠️ The video couldn’t get through'; $('waitSub').textContent = why; };
    p.addEventListener('iceconnectionstatechange', () => {
      if (p !== pc) return;
      const s = p.iceConnectionState;
      if (s === 'failed') fail('The two networks won’t let the video through. Put the iPad/phone on the same Wi-Fi as this computer.');
      if (s === 'disconnected') { failTimer = setTimeout(() => { if (p === pc && p.iceConnectionState !== 'connected') reset('Camera disconnected, waiting…'); }, 6000); }
      if (s === 'connected' || s === 'completed') clearTimeout(failTimer);
      if (s === 'closed') reset('Camera disconnected, waiting…');
    });
    try {
      await p.setRemoteDescription({ type: 'offer', sdp: m.sdp });
      // Ask for VP8: every computer's Chrome can show it.
      try {
        const caps = RTCRtpReceiver.getCapabilities('video').codecs;
        const order = caps.filter(c => /vp8/i.test(c.mimeType)).concat(caps.filter(c => !/vp8/i.test(c.mimeType)));
        p.getTransceivers().forEach(t => { if (t.receiver.track.kind === 'video' && t.setCodecPreferences) t.setCodecPreferences(order); });
      } catch (e) {}
      await p.setLocalDescription(await p.createAnswer());
      await gathered(p, 1500);
      if (p !== pc) return;
      bus.pub(TOPIC + code + '/cam/' + session, { type: 'answer', session, bid: BID, sdp: p.localDescription.sdp });
    } catch (e) { fail('Something went wrong setting up the video. Tap Stop then Start camera on the iPad.'); return; }

    failTimer = setTimeout(() => { if (p === pc && !win.classList.contains('live')) fail('Put the iPad/phone on the same Wi-Fi as this computer, then tap Stop and Start camera on it.'); }, 15000);
    statTimer = setInterval(async () => {
      if (p !== pc) return;
      let codec = '?', frames = 0, size = '', route = '';
      try {
        const st = await p.getStats(), byId = {};
        st.forEach(r => byId[r.id] = r);
        st.forEach(r => {
          if (r.type === 'inbound-rtp' && r.kind === 'video') {
            frames = r.framesDecoded || 0;
            if (r.frameWidth) size = r.frameWidth + '×' + r.frameHeight;
            if (r.codecId && byId[r.codecId]) codec = byId[r.codecId].mimeType.replace('video/', '');
          }
          if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') {
            const l = byId[r.localCandidateId], rm = byId[r.remoteCandidateId];
            if (l && rm) route = l.candidateType + '→' + rm.candidateType;
          }
        });
      } catch (e) {}
      const s = p.iceConnectionState;
      $('diag').textContent = [s, route, codec, frames + ' frames', size].filter(Boolean).join(' · ');
      if (frames > 0 && v.videoWidth > 0) { win.classList.remove('linking'); win.classList.add('live'); clearTimeout(failTimer); }
      else if (frames === 0 && (s === 'connected' || s === 'completed')) $('waitSub').textContent = 'Linked, waiting for the first picture…';
    }, 1000);
  }

  function start() {
    showJoin();
    if (!window.mqtt) { $('state').textContent = ''; $('msg').textContent = 'The page couldn’t load its connection part: check the internet and reload.'; return; }
    $('state').textContent = 'Getting ready…';
    bus = makeBus((t, m) => { if (m.type === 'offer' && t === TOPIC + code + '/board') onOffer(m); }, () => announce());
    listen();
    setInterval(() => {
      const up = bus.up();
      if (!pc) $('state').textContent = up ? 'Ready: waiting for the camera…' : 'Connecting…';
      $('msg').textContent = up ? '' : 'Can’t reach the internet services yet, still trying…';
      $('always').textContent = 'Board code ' + code + ' · services ' + up + '/' + bus.total + (pc ? ' · camera found' : '');
    }, 1000);
  }

  $('freeze').onclick = () => {
    if (win.classList.toggle('frozen')) {
      frozen.width = v.videoWidth || 1920; frozen.height = v.videoHeight || 1080;
      frozen.getContext('2d').drawImage(v, 0, 0, frozen.width, frozen.height);
      $('freeze').textContent = '▶ Unfreeze'; $('freeze').classList.add('on');
    } else { $('freeze').textContent = '⏸ Freeze'; $('freeze').classList.remove('on'); }
  };
  $('rot').onclick = () => $('rot').classList.toggle('on', win.classList.toggle('rot'));
  $('fill').onclick = () => $('fill').classList.toggle('on', win.classList.toggle('fill'));
  $('newcode').onclick = () => {
    if (bus) bus.unsub(TOPIC + code + '/board');
    reset();
    code = newCode(); store.set('boardcam.code6', code);
    if (bus) listen(); else showJoin();
  };

  start();
})();
</script>
</body>
</html>
