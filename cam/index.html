<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Board Camera</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  #stage { flex: 1; position: relative; overflow: hidden; background: #000; }
  video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #status { position: absolute; top: 12px; left: 12px; right: 12px; width: fit-content; padding: 8px 14px; border-radius: 999px;
    font-weight: 700; font-size: 16px; background: #444; }
  #status.live { background: #d92d20; }
  #status.wait { background: #b54708; }
  #diag { position: absolute; left: 12px; bottom: 10px; font: 12px/1.3 ui-monospace, monospace; color: #ddd;
    background: rgba(0,0,0,.5); padding: 3px 7px; border-radius: 6px; }
  #bar { display: flex; gap: 10px; padding: 12px; justify-content: center; flex-wrap: wrap; background: #111; }
  button { font: inherit; font-size: 18px; font-weight: 700; border: 0; border-radius: 14px;
    padding: 14px 20px; background: #2b2b2b; color: #fff; }
  button.primary { background: #6941c6; }
  #frz { font-size: 22px; padding: 16px 30px; min-width: 190px; }
  #frz.on { background: #d92d20; }
  #setup { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 18px; padding: 24px; text-align: center; background: #111; }
  #setup h1 { margin: 0; font-size: 28px; }
  #setup p { margin: 0; color: #bbb; font-size: 17px; max-width: 420px; line-height: 1.4; }
  #code { font-size: 36px; letter-spacing: 8px; width: 250px; text-align: center; padding: 10px;
    border-radius: 14px; border: 2px solid #555; background: #000; color: #fff; }
  #err { color: #fda29b; font-weight: 600; min-height: 1.2em; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline autoplay muted></video>
  <div id="status" class="hide">Connecting…</div>
  <div id="diag" class="hide"></div>
  <div id="setup">
    <h1>📷 Board Camera</h1>
    <p>Sends this camera to the board. Scan the QR code on the board, or type the 6-digit code it shows.</p>
    <input id="code" inputmode="numeric" maxlength="6" placeholder="000000" autocomplete="off">
    <button class="primary" id="go">Start camera</button>
    <div id="err"></div>
  </div>
</div>
<div id="bar" class="hide">
  <button id="frz" class="primary">⏸ Freeze</button>
  <button id="flip">🔄 Switch camera</button>
  <button id="stop">✕ Stop</button>
</div>


<script>
(() => {
  // ---- Shared settings (must match the board) ----
  const TOPIC = 'boardcam-willow-7f3a/';
  const BROKERS = window.BOARDCAM_BROKERS || [
    'wss://broker.hivemq.com:8884/mqtt',     // allowed at school
    'wss://broker.emqx.io:8084/mqtt',        // allowed at school
    'wss://test.mosquitto.org:8081/mqtt',
    'wss://mqtt.eclipseprojects.io/mqtt'
  ];
  const ICE = (window.BOARDCAM_ICE || []).concat([{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }]);

  const $ = id => document.getElementById(id);
  const v = $('v'), statusEl = $('status');
  const params = new URLSearchParams(location.search);
  let code = (params.get('c') || '').replace(/\D/g, '').slice(0, 6);
  $('code').value = code;

  let frozenOnBoard = false;
  let stream = null, pc = null, session = null, answered = false, running = false, boardId = null, pendingCands = [];
  let facing = 'environment', wakeLock = null, offerTimer = null, failTimer = null, statTimer = null, bus = null;

  const rand = () => Math.random().toString(36).slice(2, 10);
  function setStatus(text, cls) { statusEl.textContent = text; statusEl.className = cls || ''; }

  // ---- Message bus: talks through every service that answers, ignores duplicates ----
  // ---- Tiny built-in MQTT client (no library): connect, subscribe, publish over a secure websocket ----
  function MiniMQTT(url, onMessage, onUp) {
    var self = this, ws = null, buf = new Uint8Array(0), ping = null, alive = false, subs = {}, pid = 1, dead = false;
    self.connected = false;
    var enc = function (s) {
      if (window.TextEncoder) return new TextEncoder().encode(s);
      var u = unescape(encodeURIComponent(s)), a = new Uint8Array(u.length);
      for (var i = 0; i < u.length; i++) a[i] = u.charCodeAt(i);
      return a;
    };
    var dec = function (a) {
      if (window.TextDecoder) return new TextDecoder().decode(a);
      var s = ''; for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]);
      try { return decodeURIComponent(escape(s)); } catch (e) { return s; }
    };
    var str = function (s) { var b = enc(s), o = new Uint8Array(b.length + 2); o[0] = b.length >> 8; o[1] = b.length & 255; o.set(b, 2); return o; };
    var cat = function (parts) {
      var n = 0, i; for (i = 0; i < parts.length; i++) n += parts[i].length;
      var o = new Uint8Array(n), p = 0; for (i = 0; i < parts.length; i++) { o.set(parts[i], p); p += parts[i].length; }
      return o;
    };
    var packet = function (head, body) {
      var len = [], x = body.length;
      do { var d = x % 128; x = Math.floor(x / 128); if (x > 0) d |= 128; len.push(d); } while (x > 0);
      return cat([new Uint8Array([head].concat(len)), body]);
    };
    var send = function (p) { try { if (ws && ws.readyState === 1) ws.send(p); } catch (e) {} };
    var subscribe = function (t) {
      pid = (pid % 65535) + 1;
      send(packet(0x82, cat([new Uint8Array([pid >> 8, pid & 255]), str(t), new Uint8Array([0])])));
    };
    var handle = function (type, flags, body) {
      if (type === 2) { // CONNACK
        if (body[1] === 0) { self.connected = true; for (var t in subs) subscribe(t); if (onUp) onUp(); }
        else { try { ws.close(); } catch (e) {} }
      } else if (type === 3) { // PUBLISH
        var tl = (body[0] << 8) | body[1], topic = dec(body.subarray(2, 2 + tl)), p = 2 + tl;
        if ((flags >> 1) & 3) p += 2;
        onMessage(topic, dec(body.subarray(p)));
      }
      alive = true;
    };
    var feed = function (chunk) {
      buf = cat([buf, chunk]);
      for (;;) {
        if (buf.length < 2) return;
        var mult = 1, len = 0, i = 1, d;
        do { if (i >= buf.length) return; d = buf[i++]; len += (d & 127) * mult; mult *= 128; } while (d & 128);
        if (buf.length < i + len) return;
        handle(buf[0] >> 4, buf[0] & 15, buf.subarray(i, i + len));
        buf = buf.slice(i + len);
      }
    };
    var open = function () {
      if (dead) return;
      buf = new Uint8Array(0);
      try { ws = new WebSocket(url, ['mqtt']); } catch (e) { setTimeout(open, 3000); return; }
      ws.binaryType = 'arraybuffer';
      var timer = setTimeout(function () { try { ws.close(); } catch (e) {} }, 8000);
      ws.onopen = function () {
        clearTimeout(timer);
        var id = 'bc' + Math.random().toString(36).slice(2, 12);
        // MQTT 3.1.1 CONNECT: protocol "MQTT", level 4, clean session, keepalive 30s
        send(packet(0x10, cat([str('MQTT'), new Uint8Array([4, 2, 0, 30]), str(id)])));
        alive = true;
        clearInterval(ping);
        ping = setInterval(function () {
          if (!alive) { try { ws.close(); } catch (e) {} return; }
          alive = false; send(new Uint8Array([0xC0, 0]));
        }, 20000);
      };
      ws.onmessage = function (e) { feed(new Uint8Array(e.data)); };
      ws.onclose = function () { clearTimeout(timer); clearInterval(ping); self.connected = false; setTimeout(open, 3000); };
      ws.onerror = function () {};
    };
    self.subscribe = function (t) { subs[t] = 1; if (self.connected) subscribe(t); };
    self.unsubscribe = function (t) {
      delete subs[t];
      if (self.connected) { pid = (pid % 65535) + 1; send(packet(0xA2, cat([new Uint8Array([pid >> 8, pid & 255]), str(t)]))); }
    };
    self.publish = function (t, s) { if (self.connected) send(packet(0x30, cat([str(t), enc(s)]))); };
    open();
  }

  function makeBus(onMsg, onUp) {
    var clients = [], seen = {}, subs = {};
    BROKERS.forEach(function (url) {
      var c = new MiniMQTT(url, function (t, text) {
        var m; try { m = JSON.parse(text); } catch (e) { return; }
        if (!m || seen[m.mid]) return;
        seen[m.mid] = 1; onMsg(t, m);
      }, function () { if (onUp) onUp(c); });
      clients.push(c);
    });
    return {
      sub: function (t) { subs[t] = 1; clients.forEach(function (c) { c.subscribe(t); }); },
      unsub: function (t) { delete subs[t]; clients.forEach(function (c) { c.unsubscribe(t); }); },
      pub: function (t, m) { m.mid = rand() + Date.now(); var s = JSON.stringify(m); clients.forEach(function (c) { c.publish(t, s); }); },
      up: function () { return clients.filter(function (c) { return c.connected; }).length; },
      total: BROKERS.length
    };
  }

  function gathered(p, ms) {
    return new Promise(res => {
      if (p.iceGatheringState === 'complete') return res();
      const t = setTimeout(res, ms);
      p.addEventListener('icegatheringstatechange', () => { if (p.iceGatheringState === 'complete') { clearTimeout(t); res(); } });
    });
  }

  async function getCamera() {
    const old = stream;
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
    if (old) old.getTracks().forEach(t => t.stop());
    // It's writing: keep it sharp rather than smooth.
    stream.getVideoTracks().forEach(t => { try { t.contentHint = 'text'; } catch (e) {} });
    v.srcObject = stream;
    await v.play().catch(() => {});
  }

  async function keepAwake() {
    try { if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }

  function onMsg(topic, m) {
    if (m.type === 'answer' && m.session === session && !answered && pc) {
      answered = true; boardId = m.bid;
      clearTimeout(offerTimer);
      setStatus('Found the board, starting video…', 'wait');
      const p = pc;
      p.setRemoteDescription({ type: 'answer', sdp: m.sdp })
        .then(() => { pendingCands.forEach(c => p.addIceCandidate(c).catch(() => {})); pendingCands = []; })
        .catch(() => offer());
    } else if (m.type === 'frozen' && m.session === session) {
      showFrozen(!!m.on);
    } else if (m.type === 'cand' && m.session === session && pc) {
      if (pc.remoteDescription) pc.addIceCandidate(m.c).catch(() => {}); else pendingCands.push(m.c);
    } else if (m.type === 'board-up' && running) {
      const s = pc && pc.iceConnectionState;
      if (!answered || m.bid !== boardId || s === 'failed' || s === 'disconnected' || s === 'closed') offer();
    }
  }

  async function offer() {
    if (!running || !stream) return;
    clearTimeout(offerTimer); clearTimeout(failTimer); clearInterval(statTimer);
    if (pc) try { pc.close(); } catch (e) {}
    session = rand(); answered = false; pendingCands = [];
    const p = pc = new RTCPeerConnection({ iceServers: ICE });
    stream.getTracks().forEach(t => p.addTrack(t, stream));
    bus.sub(TOPIC + code + '/cam/' + session);
    bus.sub(TOPIC + code + '/cam');
    const mySession = session;
    p.onicecandidate = e => {
      if (e.candidate && p === pc) bus.pub(TOPIC + code + '/board', { type: 'cand', session: mySession, c: { candidate: e.candidate.candidate, sdpMid: e.candidate.sdpMid, sdpMLineIndex: e.candidate.sdpMLineIndex } });
    };

    p.addEventListener('iceconnectionstatechange', () => {
      if (p !== pc) return;
      const s = p.iceConnectionState;
      if (s === 'connected' || s === 'completed') { clearTimeout(failTimer); capBitrate(p); }
      if (s === 'failed') { setStatus('Video couldn’t get through: see the board for why', 'wait'); setTimeout(() => { if (p === pc) offer(); }, 20000); }
      if (s === 'disconnected') { clearTimeout(failTimer); failTimer = setTimeout(() => { if (p === pc) offer(); }, 4000); }
    });

    statTimer = setInterval(async () => {
      if (p !== pc) return;
      let frames = 0, codec = '?', size = '';
      try {
        const st = await p.getStats(), byId = {};
        st.forEach(r => byId[r.id] = r);
        st.forEach(r => {
          if (r.type === 'outbound-rtp' && r.kind === 'video') {
            frames = r.framesEncoded || r.framesSent || 0;
            if (r.frameWidth) size = r.frameWidth + '×' + r.frameHeight;
            if (r.codecId && byId[r.codecId]) codec = byId[r.codecId].mimeType.replace('video/', '');
          }
        });
      } catch (e) {}
      const s = p.iceConnectionState;
      $('diag').textContent = ['services ' + bus.up() + '/' + bus.total, s, codec, frames + ' sent', size].join(' · ');
      if (frames > 0 && (s === 'connected' || s === 'completed')) setStatus('● LIVE on the board', 'live');
    }, 1000);

    try {
      await p.setLocalDescription(await p.createOffer());
      if (p !== pc) return;
      if (!bus.up()) setStatus('Can’t reach the connection services (0/' + bus.total + ')', 'wait');
      else setStatus('Looking for board ' + code + '…', 'wait');
      bus.pub(TOPIC + code + '/board', { type: 'offer', session, sdp: p.localDescription.sdp });
    } catch (e) {}
    offerTimer = setTimeout(() => {
      if (p !== pc || answered) return;
      setStatus(bus.up() ? 'Board ' + code + ' not found: is the board page open?' : 'Can’t reach the connection services (0/' + bus.total + ')', 'wait');
      offer();
    }, 5000);
  }

  // Writing barely moves, so ~2.5 Mbps keeps it sharp without hogging the network.
  function capBitrate(p) {
    try {
      p.getSenders().forEach(sn => {
        if (!sn.track || sn.track.kind !== 'video') return;
        const prm = sn.getParameters();
        if (!prm.encodings || !prm.encodings.length) return;
        prm.encodings[0].maxBitrate = 2500000;
        sn.setParameters(prm).catch(() => {});
      });
    } catch (e) {}
  }

  $('go').onclick = async () => {
    code = $('code').value.replace(/\D/g, '');
    if (code.length !== 6) { $('err').textContent = 'Type the 6-digit code from the board.'; return; }
    $('err').textContent = '';
    try { await getCamera(); }
    catch (e) { $('err').textContent = 'Camera blocked. In Settings › Safari › Camera choose Allow, then try again.'; return; }
    running = true;
    if (!bus) bus = makeBus(onMsg);
    $('setup').classList.add('hide');
    $('bar').classList.remove('hide');
    statusEl.classList.remove('hide');
    $('diag').classList.remove('hide');
    setStatus('Connecting…', 'wait');
    keepAwake();
    // Give the services a moment to connect, then call the board.
    const t0 = Date.now();
    const wait = setInterval(() => { if (bus.up() || Date.now() - t0 > 4000) { clearInterval(wait); offer(); } }, 150);
  };

  function showFrozen(on) {
    frozenOnBoard = on;
    $('frz').textContent = on ? '▶ Unfreeze' : '⏸ Freeze';
    $('frz').classList.toggle('on', on);
  }
  // Freeze the picture on the board from here, so you don't have to walk back to the laptop.
  $('frz').onclick = () => {
    if (!bus || !session) return;
    showFrozen(!frozenOnBoard);
    bus.pub(TOPIC + code + '/board', { type: 'freeze', on: frozenOnBoard, session: session });
  };

  $('flip').onclick = async () => {
    facing = facing === 'environment' ? 'user' : 'environment';
    try {
      await getCamera();
      const sn = pc && pc.getSenders().find(s => s.track && s.track.kind === 'video');
      if (sn) await sn.replaceTrack(stream.getVideoTracks()[0]); else offer();
    } catch (e) {}
  };

  $('stop').onclick = () => {
    running = false;
    clearTimeout(offerTimer); clearTimeout(failTimer); clearInterval(statTimer);
    if (pc) try { pc.close(); } catch (e) {}
    pc = null;
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = null;
    if (wakeLock) try { wakeLock.release(); } catch (e) {}
    $('setup').classList.remove('hide');
    $('bar').classList.add('hide');
    statusEl.classList.add('hide');
    $('diag').classList.add('hide');
  };

  // iPad/iPhone pause the camera when Safari goes to the background; restart on return.
  document.addEventListener('visibilitychange', async () => {
    if (document.visibilityState !== 'visible' || !running) return;
    keepAwake();
    const dead = !stream || stream.getVideoTracks().every(t => t.readyState === 'ended');
    if (dead) { try { await getCamera(); } catch (e) {} offer(); }
  });
})();
</script>
</body>
</html>
